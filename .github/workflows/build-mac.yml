name: Build macOS (.dmg)

# Собирает Mac-версию установщика — ПОЛНОЕ ОФЛАЙН-издание (весь vendor едет на томе dmg) —
# на облачном macOS-раннере GitHub. Лёгкая (стриминговая) редакция — в build-mac-lite.yml.
# Запуск: вкладка Actions -> "Build macOS (.dmg)" -> Run workflow.
#
# Подпись и нотаризация ЕСТЬ: .app подписывает Developer ID и нотаризует electron-builder
# (шаг «Build .dmg»), финальный том собирает и подписывает шаг «Assemble final dmg».
# Готовый .dmg (~2.7 ГБ) в ассет GitHub Release не влезает (лимит 2 GiB) — он уезжает
# в Reg.ru S3, а Release создаётся УКАЗАТЕЛЕМ на S3-ссылку с sha256.

on:
  workflow_dispatch:
    inputs:
      config_ref:
        description: >-
          Коммит пака, на котором закрепить сборку (полная sha). Пусто = взять main.
          Пока пак правят параллельно, «свежий main» на момент старта успевает
          устареть к моменту гейта — и сборка либо отбраковывается, либо увозит
          не тот срез. Здесь это не теория: dmg от 01:20 увёз коммит, в котором
          имя боевого сервера ещё оставалось в описании навыка озвучки.
        required: false
        default: ''
  # Обкатка до мержа: workflow_dispatch берёт файл только из main, поэтому пробная
  # сборка идёт пушем в mac-offline/*. Такой прогон льёт dmg в vibecoding/downloads/test/
  # и Release не создаёт — боевая ссылка меняется только ручным запуском из main.
  push:
    branches: ['mac-offline/**']

# Очередь БЕЗ отмены. Отменять релизную сборку на середине нельзя: она заливает
# объекты в S3 и коммитит реестр обратно в ветку — прерывание оставит половину.
# Но и параллельно двум таким идти незачем: они гонятся за одни и те же ключи.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-mac:
    # Закреплено на macos-15, а не macos-latest (21.09.2026): образ macos-latest
    # от 07.09 начал проверять пароль в `security set-key-partition-list`, а
    # electron-builder до 26.16.0 передаёт туда пароль сертификата вместо пароля
    # своей временной связки ключей — подпись падала с «SecKeychainUnlock: The user
    # name or passphrase you entered is not correct». В lock-файле сейчас electron-builder
    # 25.1.8 (точный пин в package.json), то есть мы ПОД этим багом, и закрепление нужно.
    # Снять его, когда electron-builder в lock-файле станет ≥ 26.16.1 (electron-userland/electron-builder#10172).
    runs-on: macos-15
    # Переменная стоит на джобе, а не на отдельных шагах. Прошлый заход
    # закрепил только fetch:config и release-check — и полная сборка Mac
    # упала на гейте config-fresh, потому что до beforePack переменная не
    # доезжала: штамп говорил «24b54b6», а гейт всё ещё сверялся с «main».
    # Пин, действующий на части цепочки, хуже отсутствующего: он выглядит
    # как закрепление, а ведёт себя как его отсутствие.
    env:
      HM_CONFIG_REF: ${{ inputs.config_ref }}
    permissions:
      contents: write   # публикация dmg в Release (не artifact — квота)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Токен НЕ остаётся в .git/config (S-9, ревью): ниже `npm ci` исполняет install-скрипты ~390 пакетов
          # в этом же рабочем каталоге, и любой из них прочитал бы токен с правом contents: write. Шагам,
          # которым токен нужен, он передаётся окружением самого шага (GH_TOKEN у `gh release`).
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # Тот же гейт, что стоит первым в `npm run dist` / `dist:win` / `dist:mac`. Здесь он
      # нужен отдельным шагом, потому что сборка ниже зовёт electron-builder НАПРЯМУЮ, мимо
      # npm-скрипта, — а хука beforePack у этой проверки нет (в отличие от preflight).
      # Ловит она случай, когда мутацию от lite-сборки закоммитили: build-lite.js возвращает
      # package.json и config.json в finally, но до finally процесс доживает не всегда —
      # жёсткое убийство, падение машины, — а бывает, что и сам возврат не проходит
      # (EPERM, файл держит антивирус: build-lite это печатает и выходит ненулевым, но
      # дерево остаётся грязным). Опаснее половина с config.json: застрявшее edition:'lite' МОЛЧА
      # выключает предполётные гейты (preflight решает «для этого издания проверять нечего»),
      # и офлайн-dmg уехал бы без проверки свежести конфиг-пака, а по логу выглядел бы нормально.
      # Проверка на секунду и без зависимостей — поэтому стоит ДО npm ci и до фетчей.
      - name: Assert clean tree (собираем офлайн-издание, а не остатки lite)
        run: npm run assert:clean

      # `npm ci`, а не `npm install` (S-9): этот джоб держит секреты Apple и Reg.ru S3, а `npm install` вправе
      # переписать lock-файл и подтянуть иную версию зависимости, чем проверенная ревью. `npm ci` ставит РОВНО
      # то, что в package-lock.json (там версии и integrity всех 388 пакетов), и падает, если lock и package.json
      # разошлись. Согласованность проверена сухим прогоном `npm ci --dry-run --offline --ignore-scripts`.
      - name: Install deps
        run: npm ci --no-audit --no-fund

      # Одна переменная закрепляет всю цепочку: fetch-config, гейт config-fresh
      # в preflight и release-check читают её же.
      - name: Fetch config (bundle into installer)
        run: npm run fetch:config

      # Личный список паттернов экспорт-фильтра nomad-src (имена, адреса и домены владельца) в публичном
      # репозитории не лежит, а РЕЛИЗНАЯ сборка без него не идёт: tools/fetch-vendor-mac.sh при CI=true
      # останавливается (FATAL), если списка нет, он битый или пустой (docs/specs/obsluzhivanie-vendor.md, п. 17).
      # Секрет HM_LEAK_PATTERNS_JSON — тот же JSON, что лежит в tools/leak-patterns.local.json на машине владельца.
      # Шаг записывает его ФАЙЛОМ под $RUNNER_TEMP и дальше отдаёт только ПУТЬ (HM_LEAK_PATTERNS_FILE): само значение
      # в переменной окружения унаследовали бы все дочерние процессы шага загрузки (pip, playwright, git).
      # Секрет приходит окружением шага, а не подстановкой в текст скрипта, и нигде не печатается: GitHub маскирует
      # структурированные секреты (JSON) в логе ненадёжно, надёжнее всего не выводить значение вовсе, поэтому и
      # ::add-mask:: тут нечему — ни одно производное значение не вычисляется и не печатается.
      # Секрета нет — шаг только предупреждает: решение «стоп» принимает сам fetch-vendor-mac.sh (одно место, где
      # живёт и осознанный обход HM_ALLOW_NO_PRIVATE_LEAK_LIST), а не копия этой логики в YAML.
      - name: Stage private leak-pattern list (секрет HM_LEAK_PATTERNS_JSON → файл)
        env:
          HM_LEAK_PATTERNS_JSON: ${{ secrets.HM_LEAK_PATTERNS_JSON }}
        run: |
          set -e
          if [ -z "${HM_LEAK_PATTERNS_JSON:-}" ]; then
            echo "::warning::секрет HM_LEAK_PATTERNS_JSON не задан или пуст — fetch-vendor-mac.sh остановит релизную сборку: личного списка паттернов нет."
            exit 0
          fi
          umask 077
          LP="$RUNNER_TEMP/hm-leak-patterns.json"
          printf '%s' "$HM_LEAK_PATTERNS_JSON" > "$LP"
          echo "HM_LEAK_PATTERNS_FILE=$LP" >> "$GITHUB_ENV"
          echo "личный список паттернов записан файлом ($(wc -c < "$LP" | tr -d ' ') байт); значения в лог не выводятся."

      - name: Fetch macOS vendor (full offline — apps, wheels, Chromium)
        env:
          # Приватный репо Nomad-агента (JHamidun/nomad) — клонируется на раннере с токеном
          # из секрета. Без него компонент Nomad делает graceful skip (dmg без агента).
          NOMAD_AGENT_GIT_URL: ${{ secrets.NOMAD_AGENT_GIT_URL }}
          # Аутентификация к api.github.com (маскот-релизы, шрифт): анонимный лимит на
          # shared-IP раннера → транзиентные 403 → FATAL. С токеном лимит на порядки выше.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/fetch-vendor-mac.sh

      # Список нужен только загрузке vendor. Сборка ниже исполняет стороннее (electron-builder и его зависимости)
      # в том же джобе, и читать личные паттерны владельца им незачем: файл удаляется сразу, а переменная
      # обнуляется для всех следующих шагов. always() — чтобы он не остался и после падения загрузки.
      - name: Drop private leak-pattern list from the runner
        if: always()
        run: |
          if [ -n "${HM_LEAK_PATTERNS_FILE:-}" ]; then rm -f "$HM_LEAK_PATTERNS_FILE"; fi
          echo "HM_LEAK_PATTERNS_FILE=" >> "$GITHUB_ENV"

      # ПОСЛЕ fetch-vendor-mac.sh и ДО сборки — порядок обязателен, а не косметика.
      # Тот скрипт переписывает корневой config.json целиком (пишет туда
      # `offlineEdition`, см. tools/fetch-vendor-mac.sh:714-722). Подстановка секрета
      # раньше него была бы ЗАТЁРТА молча: сборка осталась бы зелёной, а маяк уехал
      # неподписанным — то есть ровно тот случай, ради которого всё это и делается.
      #
      # (`fetch:config` config.json НЕ трогает — он пишет только штамп внутри пака;
      # проверено обходом tools/fetch-config.js, единственный writeFileSync там на
      # `.hamidun-config-pack.json`. Первая редакция этого комментария утверждала
      # обратное — исправлено до вливания.)
      # Секрет подписи маяка завершения курса. Читает его ТОЛЬКО этот шаг (`npm run beacon:stamp`,
      # tools/stamp-beacon-secret.js) и кладёт в config.json НА ВРЕМЯ СБОРКИ; в репозитории поле
      # остаётся пустым, это сторожит тест. Дальше electron-builder берёт готовый config.json с диска
      # и самого секрета из окружения не читает — поэтому он задан здесь, на шаге, а не на джобе (S-9).
      # Раньше он висел на уровне джоба и был виден `npm install` и скриптам установки всех зависимостей,
      # то есть любой пакет в дереве зависимостей мог его прочитать и унести.
      #
      # Нет секрета — маяк уйдёт неподписанным, сборка НЕ падает (см. комментарий в config.json).
      # Истина живёт в CC_BEACON_SECRET контейнера academy-funnel; менять надо обе стороны разом.
      - name: Stamp beacon secret (подпись маяка; в репозиторий не коммитится)
        env:
          HM_COURSE_BEACON_SECRET: ${{ secrets.HM_COURSE_BEACON_SECRET }}
        run: npm run beacon:stamp

      - name: Validate bundled git (dugite)
        run: |
          set -e
          TGZ="vendor/apps/git-macos-arm64.tar.gz"
          [ -s "$TGZ" ] || { echo "нет $TGZ"; exit 1; }
          G="$RUNNER_TEMP/hm-git"; rm -rf "$G"; mkdir -p "$G"
          tar -xzf "$TGZ" -C "$G"
          xattr -dr com.apple.quarantine "$G" 2>/dev/null || true
          export GIT_EXEC_PATH="$G/libexec/git-core"
          export GIT_TEMPLATE_DIR="$G/share/git-core/templates"
          export GIT_CONFIG_SYSTEM="$G/etc/gitconfig"
          echo "arch раннера: $(uname -m)"
          "$G/bin/git" --version
          # реальный сценарий: init + commit + clone по https (TLS через системный libcurl)
          T="$RUNNER_TEMP/gt"; rm -rf "$T"; mkdir -p "$T"; cd "$T"
          "$G/bin/git" init -q . && echo "x" > a.txt && "$G/bin/git" add a.txt
          "$G/bin/git" -c user.email=t@t -c user.name=t commit -qm t
          "$G/bin/git" clone -q --depth 1 https://github.com/desktop/dugite-native.git d && echo "https-clone OK"
          echo "ВШИТЫЙ GIT РАБОТАЕТ на $(uname -m)"

      # Записываем App Store Connect API-ключ (.p8) из secret в файл для notarytool.
      # Секрет — через env-блок, НЕ интерполяцией в run-текст (анти-паттерн: значение
      # попадает в сгенерированный скрипт шага; при set -x/ошибке шаблона риск утечки).
      - name: Prepare notarization API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build .dmg (Developer ID signed + notarized, universal full-offline)
        env:
          # Подпись: electron-builder возьмёт .p12 из CSC_LINK (base64) + пароль.
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          # Нотаризация через notarytool + App Store Connect API-ключ.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --universal --publish never

      # Гейт fuse. Хук afterPack (tools/after-pack.js) гасит RunAsNode, NODE_OPTIONS и --inspect
      # в Electron Framework до подписи; здесь — независимая сверка по байтам готового .app.
      # Сборка выше зовёт electron-builder НАПРЯМУЮ, мимо npm-скрипта dist:mac, где стоит тот же гейт.
      - name: Gate — fuses выключены в .app (RunAsNode, NODE_OPTIONS, --inspect)
        run: node tools/verify-fuses.js release/mac-universal

      # electron-builder нотаризовал+застейплил ЧИСТЫЙ .app (без vendor — иначе notary
      # ругается на неподписанные .so в .whl). Финальный dmg с офлайн-vendor собираем
      # САМИ через hdiutil: том нужного размера (electron-builder сайзит только под .app
      # → ENOSPC на 1ГБ vendor). Нотаризованный app запускается чисто; dmg подписываем
      # Developer ID (сам dmg не нотаризуем — vendor бы завалил, а app и так застейплен).
      - name: Assemble final dmg (notarized app + offline vendor)
        env:
          APPLE_CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          # Идентификатор подписи несёт ЮРИДИЧЕСКОЕ ИМЯ владельца. Открытым текстом
          # в публичном репозитории ему не место, поэтому он приходит секретом —
          # GitHub заодно маскирует его в логах сборки.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -e
          APP="release/mac-universal/Hamidun Setup.app"
          [ -d "$APP" ] || { echo "нет .app от electron-builder"; exit 1; }
          echo "=== lipo -archs на Electron-бинаре (MUST быть arm64 + x86_64) ==="
          EXEBIN="$APP/Contents/MacOS/Hamidun Setup"
          [ -f "$EXEBIN" ] || EXEBIN="$(ls "$APP/Contents/MacOS/" | head -n1 | sed "s#^#$APP/Contents/MacOS/#")"
          EXEARCHS=$(lipo -archs "$EXEBIN" || echo "?")
          echo "archs: $EXEARCHS"
          echo "$EXEARCHS" | grep -q arm64  || { echo "FATAL: нет arm64 слайса"; exit 1; }
          echo "$EXEARCHS" | grep -q x86_64 || { echo "FATAL: нет x86_64 слайса — .app не universal"; exit 1; }
          echo "=== staple нотаризации на .app ==="
          xcrun stapler validate "$APP" && echo "STAPLED OK" || echo "WARN: staple не подтверждён (app всё равно нотаризован в БД Apple)"
          # keychain для подписи dmg (кейчейн electron-builder уже мог быть удалён)
          KC="$RUNNER_TEMP/dmgsign.keychain-db"; KP="hmpw$RANDOM"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$APPLE_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/idcert.p12"
          security import "$RUNNER_TEMP/idcert.p12" -k "$KC" -P "$APPLE_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed s/\"//g)
          # стейджинг: нотаризованный app + vendor + инструкция + ярлык Applications
          ST="$RUNNER_TEMP/dmgstage"; rm -rf "$ST"; mkdir -p "$ST"
          cp -R "$APP" "$ST/"
          cp -R vendor "$ST/vendor"
          # Инструкция — обязательна, а не «если получится». Именно её читает человек,
          # у которого Gatekeeper написал «повреждено», и без неё он остаётся с кирпичом.
          # Прежнее `2>/dev/null || true` глотало ровно тот случай, ради которого файл и
          # существует: имя кириллическое, и любая осечка с кодировкой или переименование
          # молча выпускали образ БЕЗ инструкции — в логе при этом всё зелёное.
          HMTXT="assets/mac/ПРОЧТИ ЕСЛИ ПИШЕТ ПОВРЕЖДЕНО.txt"
          [ -f "$HMTXT" ] || { echo "::error::нет файла инструкции: $HMTXT"; ls -la assets/mac/; exit 1; }
          cp "$HMTXT" "$ST/"
          [ -s "$ST/$(basename "$HMTXT")" ] || { echo "::error::инструкция не легла в стейджинг"; exit 1; }
          ln -s /Applications "$ST/Applications"
          OUT="release/Hamidun-Setup-Mac.dmg"; rm -f "$OUT"
          echo "=== hdiutil create (том сам под размер контента) ==="
          # hdiutil периодически падает "Resource busy" на свежескопированном 2.7ГБ vendor
          # (Spotlight/индексация держит ресурс) — ретраим с detach стейл-маунтов + паузой.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "Hamidun Setup" -srcfolder "$ST" -fs HFS+ -format UDZO -ov "$OUT"; then
              echo "hdiutil create OK (попытка $attempt)"; break
            fi
            echo "hdiutil create failed (попытка $attempt: Resource busy?) — detach + пауза"
            hdiutil detach "/Volumes/Hamidun Setup" -force 2>/dev/null || true
            rm -f "$OUT"; sync; sleep 15
            [ "$attempt" = 5 ] && { echo "hdiutil create: все 5 попыток исчерпаны"; exit 1; }
          done
          echo "=== подпись dmg Developer ID ==="
          # Пустой секрет ловим ЗДЕСЬ, а не по симптомам. Идентификатор приехал из
          # секрета (в нём юридическое имя владельца, в публичном репозитории ему не
          # место) — а секрет можно переименовать, отозвать или просто не завести в
          # форке. `codesign --sign ""` при этом не обязан падать: он может уйти в
          # ad-hoc подпись, и следующая же строка `--verify` её ПРИМЕТ. Тогда сборка
          # зелёная, dmg «подписан», а у человека Gatekeeper всё равно ругается.
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::error::пуст секрет APPLE_SIGNING_IDENTITY — подписывать нечем."
            echo "Заведи его в Settings → Secrets (значение: строка Developer ID Application из вывода"
            echo "security find-identity -v -p codesigning). Собирать НЕподписанный dmg молча не будем."
            exit 1
          fi
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" --keychain "$KC" "$OUT"
          codesign --verify --verbose "$OUT"
          # --verify говорит «подпись цела», но НЕ говорит «подписано Developer ID»:
          # ad-hoc подпись он тоже считает целой. Спрашиваем, КТО подписал, и требуем
          # именно Developer ID Application.
          AUTH=$(codesign -dvv "$OUT" 2>&1 | grep -E '^Authority=' | head -1 || true)
          echo "подписант: ${AUTH:-(не определён)}"
          case "$AUTH" in
            *"Developer ID Application"*) echo "OK: dmg подписан Developer ID." ;;
            *) echo "::error::dmg подписан НЕ Developer ID (${AUTH:-подписант не определён}) — у человека это даст «повреждено»."; exit 1 ;;
          esac
          ls -la "$OUT"

      # Universal dmg ~2.7 ГБ > 2 GiB — лимит ассета GitHub Release (HTTP 422). Заливаем
      # напрямую в Reg.ru S3 (без лимита, основное RU-зеркало). boto3 upload_file = multipart
      # (как медиа лендинга через _deploy_vibe.put — проверено на Reg.ru). GitHub Release
      # остаётся как УКАЗАТЕЛЬ на S3-ссылку (сам dmg туда не влезает).
      - name: Upload universal dmg to Reg.ru S3
        env:
          HM_EVENT: ${{ github.event_name }}
          HM_RUN: ${{ github.run_number }}
          REGRU_S3_ACCESS_KEY: ${{ secrets.REGRU_S3_ACCESS_KEY }}
          REGRU_S3_SECRET_KEY: ${{ secrets.REGRU_S3_SECRET_KEY }}
          REGRU_S3_ENDPOINT: ${{ secrets.REGRU_S3_ENDPOINT }}
          REGRU_S3_BUCKET: ${{ secrets.REGRU_S3_BUCKET }}
          REGRU_S3_REGION: ${{ secrets.REGRU_S3_REGION }}
        run: |
          set -e
          ls -la release/*.dmg
          # macOS-раннер: системный python3 externally-managed (PEP 668) → нужен
          # --break-system-packages. Ставим boto3 только если его нет.
          python3 -c "import boto3" 2>/dev/null || python3 -m pip install --quiet --break-system-packages boto3
          python3 - <<'PY'
          import os, boto3
          from boto3.s3.transfer import TransferConfig
          s3 = boto3.client('s3', endpoint_url=os.environ['REGRU_S3_ENDPOINT'],
              aws_access_key_id=os.environ['REGRU_S3_ACCESS_KEY'],
              aws_secret_access_key=os.environ['REGRU_S3_SECRET_KEY'],
              region_name=os.environ['REGRU_S3_REGION'])
          if os.environ.get('HM_EVENT') == 'workflow_dispatch':
              key = 'vibecoding/downloads/Hamidun-Setup-Mac.dmg'
          else:
              key = 'vibecoding/downloads/test/Hamidun-Setup-Mac-run%s.dmg' % os.environ.get('HM_RUN', 'x')
          print('S3 key:', key)
          bucket = os.environ['REGRU_S3_BUCKET']
          # СТАРЫЙ dmg НЕ УДАЛЯЕМ — заливаем поверх.
          # Раньше здесь стоял delete_object: квота бакета была ~10ГБ, и overwrite 2.7ГБ
          # требовал 2x места → QuotaExceeded. Ценой был ПРОВАЛ боевой ссылки: между
          # удалением и концом заливки (десятки минут для 2.7ГБ из США в RU-S3) кнопка
          # «Скачать для macOS» отдавала 404 всем, кто в этот момент зашёл. Квота поднята
          # до 50ГБ (занято ~12ГБ) — запаса на временное удвоение хватает с избытком,
          # поэтому окно недоступности больше не нужно и не оправдано.
          # abort ТОЛЬКО orphan'ы своего ключа — чтобы не убить in-flight multipart
          # параллельной заливки (напр. Windows exe) в тот же бакет (root cause гонки).
          for u in s3.list_multipart_uploads(Bucket=bucket).get('Uploads', []):
              if u['Key'] == key:
                  s3.abort_multipart_upload(Bucket=bucket, Key=u['Key'], UploadId=u['UploadId'])
                  print('aborted orphan multipart:', u['Key'])
          cfg = TransferConfig(multipart_threshold=64*1024*1024, multipart_chunksize=64*1024*1024, use_threads=True)
          s3.upload_file('release/Hamidun-Setup-Mac.dmg', bucket, key,
              ExtraArgs={'ACL': 'public-read', 'ContentType': 'application/x-apple-diskimage'}, Config=cfg)
          print('S3 OK:', os.environ['REGRU_S3_ENDPOINT'] + '/' + os.environ['REGRU_S3_BUCKET'] + '/' + key)
          PY

      - name: Publish GitHub Release pointer (S3 link)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="mac-build-${{ github.run_number }}"
          URL="https://s3.regru.cloud/hamidun-academy-materials/vibecoding/downloads/Hamidun-Setup-Mac.dmg"
          # sha256 dmg в notes: пользователю есть чем проверить 2.7 ГБ загрузку с S3.
          DMG_SHA256=$(shasum -a 256 "release/Hamidun-Setup-Mac.dmg" | awk '{print $1}')
          echo "dmg sha256: $DMG_SHA256"
          NOTES="Universal (arm64 + x86_64) macOS installer — работает нативно на Apple Silicon и Intel.

          Скачать: $URL

          SHA-256: \`$DMG_SHA256\`
          Проверка после скачивания: \`shasum -a 256 Hamidun-Setup-Mac.dmg\` — хеш обязан совпасть.

          (Сам .dmg ~2.7 ГБ живёт на Reg.ru S3 — превышает лимит ассета GitHub Release 2 GiB.)"
          gh release create "$TAG" --title "Hamidun-Setup-Mac universal (run ${{ github.run_number }})" --notes "$NOTES" \
            || gh release edit "$TAG" --title "Hamidun-Setup-Mac universal (run ${{ github.run_number }})" --notes "$NOTES"

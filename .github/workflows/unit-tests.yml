name: Юнит-тесты (гейт push/PR)

# Глубокое ревью (Opus+Fable), находка И-10: ни один workflow не запускался
# автоматически на push/PR — только вручную (workflow_dispatch) или на
# специальных ветках (e2e/**, mac-lite/**, probe/**). Любой коммит в main
# уезжал БЕЗ единой автоматической проверки; test/run-tests.js (350+ тестов,
# ловит именно те регрессии, что находил ручной рой Opus+Fable) не гейтил
# ничего сам по себе.
#
# Этот workflow — БЫСТРЫЙ и ОБЯЗАТЕЛЬНЫЙ гейт: весь юнит-набор (~2.5 мин
# локально), синтаксис-проверки .ps1/.sh уже встроены В САМ test/run-tests.js
# (ParseFile / bash -n для каждого скрипта). continue-on-error здесь НЕ
# ставим нигде — падение обязано ронять джоб, иначе это не гейт, а видимость.
#
# Тяжёлые GUI E2E-прогоны (e2e-win.yml/build-mac*.yml, реальная докачка с
# S3, десятки минут, macOS-раннеры дороги) сознательно остаются
# workflow_dispatch/по требованию — гонять их на КАЖДЫЙ push было бы
# избыточно дорого и медленно; их страхует этот быстрый гейт + ручной запуск
# перед релизом.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Отмена устаревших прогонов. Новый push в ту же ветку делает предыдущий прогон
# бессмысленным — но он продолжает жечь раннер. На macOS это десятикратный тариф.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-windows:
    name: npm test (Windows — .ps1 + bash-скрипты)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: Юнит-тесты — ОБЯЗАТЕЛЬНЫЙ гейт (без continue-on-error)
        run: npm test

      # Размеры компонентов в окне установщика обязаны сходиться с тем, что реально
      # лежит в vendor. На раннере vendor не развёрнут, поэтому здесь сверять нечего —
      # и скрипт честно скажет «ПРОПУЩЕНО: НИ ОДНО число не сверено», а не «ОК».
      # Ценность шага в другом: он ловит СЛОМАННЫЙ генератор (синтаксис, падение,
      # ненулевой код возврата) до того, как им воспользуются на машине с vendor.
      # Реальная сверка происходит локально после fetch:vendor и в юнит-тестах выше.
      - name: Проверка размеров компонентов (генератор жив и не врёт)
        run: npm run sizes:check

  unit-tests-macos:
    name: npm test (macOS — .sh скрипты нативно)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      - name: Юнит-тесты — ОБЯЗАТЕЛЬНЫЙ гейт (без continue-on-error)
        run: npm test

      # Размеры компонентов в окне установщика обязаны сходиться с тем, что реально
      # лежит в vendor. На раннере vendor не развёрнут, поэтому здесь сверять нечего —
      # и скрипт честно скажет «ПРОПУЩЕНО: НИ ОДНО число не сверено», а не «ОК».
      # Ценность шага в другом: он ловит СЛОМАННЫЙ генератор (синтаксис, падение,
      # ненулевой код возврата) до того, как им воспользуются на машине с vendor.
      # Реальная сверка происходит локально после fetch:vendor и в юнит-тестах выше.
      - name: Проверка размеров компонентов (генератор жив и не врёт)
        run: npm run sizes:check

name: Юнит-тесты (гейт push/PR)

# Глубокое ревью (Opus+Fable), находка И-10: ни один workflow не запускался
# автоматически на push/PR — только вручную (workflow_dispatch) или на
# специальных ветках (e2e/**, mac-lite/**, probe/**). Любой коммит в main
# уезжал БЕЗ единой автоматической проверки; test/run-tests.js (350+ тестов,
# ловит именно те регрессии, что находил ручной рой Opus+Fable) не гейтил
# ничего сам по себе.
#
# Этот workflow — БЫСТРЫЙ и ОБЯЗАТЕЛЬНЫЙ гейт: весь юнит-набор (~2.5 мин
# локально), синтаксис-проверки .ps1/.sh уже встроены В САМ test/run-tests.js
# (ParseFile / bash -n для каждого скрипта). continue-on-error здесь НЕ
# ставим нигде — падение обязано ронять джоб, иначе это не гейт, а видимость.
#
# Тяжёлые GUI E2E-прогоны (e2e-win.yml/build-mac*.yml, реальная докачка с
# S3, десятки минут, macOS-раннеры дороги) сознательно остаются
# workflow_dispatch/по требованию — гонять их на КАЖДЫЙ push было бы
# избыточно дорого и медленно; их страхует этот быстрый гейт + ручной запуск
# перед релизом.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Отмена устаревших прогонов. Новый push в ту же ветку делает предыдущий прогон
# бессмысленным — но он продолжает жечь раннер. На macOS это десятикратный тариф.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Что вообще затронуто. Отдельная джоба на ubuntu (в десять раз дешевле macOS)
  # существует ради одного: не поднимать дорогие раннеры, когда правились только
  # документы и бэклог. За август таких push-ей набралось заметно.
  #
  # ВАЖНО про защиту ветки: пропущенная джоба считается ОЖИДАЮЩЕЙ и блокирует PR
  # навсегда, если сделать её обязательной проверкой. Поэтому обязательной
  # назначается джоба `gate` внизу — она идёт ВСЕГДА и принимает пропуск как успех.
  changes:
    name: Что затронуто
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" --depth=200 || git fetch --no-tags origin "${{ github.base_ref }}"
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            BEFORE="${{ github.event.before }}"
            # Первый push в ветку и force-push дают несуществующий или нулевой BEFORE.
            # Тогда честнее считать, что затронуто всё, чем молча пропустить тесты.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              FILES=$(git ls-files)
            else
              FILES=$(git diff --name-only "$BEFORE" HEAD)
            fi
          fi
          echo "Затронуто файлов: $(echo \"$FILES\" | grep -c . || true)"
          # Список НЕ-кода задан белым списком, а не чёрным: незнакомое расширение
          # должно считаться кодом и запускать тесты. Пропуск по ошибке дороже
          # лишнего прогона.
          CODE=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|.beads/*|LICENSE|*.webp|*.png|*.jpg|*.svg) ;;
              *) CODE=true; echo "  код: $f"; break ;;
            esac
          done <<< "$FILES"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Тесты нужны: $CODE"
  unit-tests-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: npm test (Windows — .ps1 + bash-скрипты)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      # Вывод пишется в файл и уезжает артефактом (шаг ниже). Причина: падение
      # 33200117231 не оставило улик — логи упавших джоб пришли ПУСТЫМИ, шаги через
      # API не отдались, и восстановить причину по следам было нечем. Перезапуск без
      # единой правки дал зелёное. На плавающий гейт перестают смотреть, поэтому
      # каждое падение обязано оставлять улику.
      #
      # PIPESTATUS[0], а не $? — иначе код возврата придёт от tee, и красное станет
      # зелёным. Ровно эта подмена уже случалась дважды в ручных прогонах.
      - name: Юнит-тесты — ОБЯЗАТЕЛЬНЫЙ гейт (без continue-on-error)
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          echo "=== npm test exit=$code ===" | tee -a test-output.log
          exit $code

      - name: Полный вывод тестов артефактом (улика на случай плавающего падения)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-windows
          path: test-output.log
          retention-days: 14
          if-no-files-found: warn

      # Размеры компонентов в окне установщика обязаны сходиться с тем, что реально
      # лежит в vendor. На раннере vendor не развёрнут, поэтому здесь сверять нечего —
      # и скрипт честно скажет «ПРОПУЩЕНО: НИ ОДНО число не сверено», а не «ОК».
      # Ценность шага в другом: он ловит СЛОМАННЫЙ генератор (синтаксис, падение,
      # ненулевой код возврата) до того, как им воспользуются на машине с vendor.
      # Реальная сверка происходит локально после fetch:vendor и в юнит-тестах выше.
      - name: Проверка размеров компонентов (генератор жив и не врёт)
        run: npm run sizes:check

  unit-tests-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: npm test (macOS — .sh скрипты нативно)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci --no-audit --no-fund

      # См. тот же блок в windows-джобе: улика обязательна, PIPESTATUS[0] обязателен.
      - name: Юнит-тесты — ОБЯЗАТЕЛЬНЫЙ гейт (без continue-on-error)
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          echo "=== npm test exit=$code ===" | tee -a test-output.log
          exit $code

      - name: Полный вывод тестов артефактом (улика на случай плавающего падения)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-macos
          path: test-output.log
          retention-days: 14
          if-no-files-found: warn

      # Размеры компонентов в окне установщика обязаны сходиться с тем, что реально
      # лежит в vendor. На раннере vendor не развёрнут, поэтому здесь сверять нечего —
      # и скрипт честно скажет «ПРОПУЩЕНО: НИ ОДНО число не сверено», а не «ОК».
      # Ценность шага в другом: он ловит СЛОМАННЫЙ генератор (синтаксис, падение,
      # ненулевой код возврата) до того, как им воспользуются на машине с vendor.
      # Реальная сверка происходит локально после fetch:vendor и в юнит-тестах выше.
      - name: Проверка размеров компонентов (генератор жив и не врёт)
        run: npm run sizes:check

  # Гейт против расхождения спек с кодом.
  #
  # ОТДЕЛЬНАЯ ubuntu-джоба, и это не про экономию, а про полноту. Проверка
  # платформонезависимая (читает файлы репозитория), поэтому дважды её гонять
  # незачем — но главное в другом: классификатор `changes` считает `docs/*` и `*.md`
  # НЕ кодом, и правка одной только спеки не поднимает тестовые джобы вовсе. Стой
  # эта проверка шагом внутри windows-джобы, она бы молча пропускала ровно тот
  # случай, ради которого написана: PR, который правит спеку и разъезжает с кодом.
  #
  # Поэтому джоба идёт ВСЕГДА, без условия на `changes`. Она дешёвая: ubuntu по
  # одинарному тарифу, без npm ci — скрипты стоят на голом Node.
  specs:
    name: Спеки сверены с кодом и тестами
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run specs:check

  # ЕДИНСТВЕННАЯ обязательная проверка для защиты ветки.
  #
  # Идёт всегда (if: always()), поэтому «пропущено» никогда не превращается в
  # «ожидает» и не запирает PR. Падает только если тестовая джоба реально упала;
  # пропуск по отсутствию кодовых изменений считается успехом осознанно.
  gate:
    name: Гейт юнит-тестов
    if: always()
    needs: [changes, unit-tests-windows, unit-tests-macos, specs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          W="${{ needs.unit-tests-windows.result }}"
          M="${{ needs.unit-tests-macos.result }}"
          C="${{ needs.changes.result }}"
          S="${{ needs.specs.result }}"
          echo "changes=$C  windows=$W  macos=$M  specs=$S"
          if [ "$C" != "success" ]; then
            echo "::error::Определение затронутого не отработало — не могу утверждать, что тесты не нужны."
            exit 1
          fi
          # Тестовые джобы: пропуск законен (правились только документы).
          for r in "$W" "$M"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::Юнит-тесты не прошли (windows=$W macos=$M)"; exit 1 ;;
            esac
          done
          # Спеки — БЕЗ поблажки на skipped: джоба идёт всегда и условий не имеет,
          # поэтому «пропущено» здесь означало бы поломку самого воркфлоу, а не
          # законный пропуск. Принять его за успех значило бы завести проверку,
          # которая молча перестаёт проверять.
          if [ "$S" != "success" ]; then
            echo "::error::Спеки разошлись с кодом или проверка не отработала (specs=$S)"
            exit 1
          fi
          echo "Гейт пройден."
